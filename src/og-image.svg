<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1813"/>
      <stop offset="0.5" stop-color="#14130f"/>
      <stop offset="1" stop-color="#100f0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3bb5a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#e3bb5a" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>

  <text x="80" y="150" font-family="'Courier New', monospace" font-size="26" letter-spacing="6"
        fill="#e3bb5a">SENIOR STAFF SOFTWARE ENGINEER</text>

  <text x="76" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700"
        fill="#f0ece3">Tarun <tspan fill="url(#gold)">Adari</tspan></text>

  <text x="80" y="410" font-family="Georgia, serif" font-style="italic" font-size="40"
        fill="#a39e92">14+ Years · Java &amp; Cloud Architecture · AI / MCP / Agents</text>

  <g font-family="'Courier New', monospace" font-size="24" fill="#82b2d6">
    <rect x="80"  y="470" width="200" height="54" fill="none" stroke="#e3bb5a" stroke-width="1.5" opacity="0.4"/>
    <text x="180" y="505" text-anchor="middle">Claude LLM</text>
    <rect x="300" y="470" width="160" height="54" fill="none" stroke="#e3bb5a" stroke-width="1.5" opacity="0.4"/>
    <text x="380" y="505" text-anchor="middle">MCP</text>
    <rect x="480" y="470" width="220" height="54" fill="none" stroke="#e3bb5a" stroke-width="1.5" opacity="0.4"/>
    <text x="590" y="505" text-anchor="middle">AI Agents</text>
    <rect x="720" y="470" width="200" height="54" fill="none" stroke="#e3bb5a" stroke-width="1.5" opacity="0.4"/>
    <text x="820" y="505" text-anchor="middle">Kafka</text>
  </g>

  <text x="1120" y="590" text-anchor="end" font-family="'Courier New', monospace" font-size="22"
        fill="#6b6b63" letter-spacing="2">tarunadari.onrender.com</text>
</svg>
